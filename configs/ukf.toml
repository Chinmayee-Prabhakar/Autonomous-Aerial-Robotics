# M4 attitude-only right-error UKF. Parameters declared before evaluating truth.
[filter]
initial_quaternion_bw = [1.0, 0.0, 0.0, 0.0]
initial_attitude_std_deg = [10.0, 10.0, 30.0]
# Body-rate standard deviation per IMU sample (rad/s); Q_angle = diag(std²) * dt².
gyro_noise_std_rad_s = [0.003, 0.003, 0.004]
# Approximate full-rank covariance of normalized specific-force Cartesian components.
# Unitless per sample; 0.05 corresponds roughly to 0.49 m/s² near 1 g.
accel_direction_std = [0.05, 0.05, 0.05]
alpha = 1.0
beta = 2.0
kappa = 0.0
covariance_floor_rad2 = 1e-12
mean_tolerance_rad = 1e-11
mean_max_iterations = 20

[evaluation]
input_root = "outputs/imu"
imu_config = "configs/imu.toml"
madgwick_config = "configs/madgwick.toml"

# An additional analytical case with a declared, nonlevel initial orientation.
[nonlevel_rotation]
initial_roll_pitch_yaw_deg = [17.0, -11.0, 23.0]
body_rate_rad_s = [0.17, 0.11, -0.19]
duration_s = 6.0
sample_hz = 50.0
