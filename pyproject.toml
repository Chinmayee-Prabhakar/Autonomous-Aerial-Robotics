[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-autonomy"
version = "0.1.0"
description = "Independent, reproducible aerial autonomy experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4", "Pillow>=10,<12"]

[tool.setuptools.packages.find]
where = ["src"]

